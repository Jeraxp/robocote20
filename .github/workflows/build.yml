name: Build & Push GHCR

# Builda a imagem Docker do Robocote 2.0 e publica no GitHub Container Registry
# a cada push em `main` ou tag `v*`. Sem dependência de Docker no PC do dev.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy automático: avisa o Portainer (webhook HTTPS) pra re-puxar a imagem :latest
  # e redeployar o serviço no swarm. Sem SSH, sem firewall, sem IP dinâmico.
  #
  # Pré-requisito (1x, feito por humano com acesso ao Portainer):
  #   1. Portainer → o serviço Robocote → Service webhook → Create → copiar a URL.
  #   2. GitHub repo → Settings → Secrets and variables → Actions → New secret:
  #        PORTAINER_WEBHOOK_URL = <a URL copiada>
  # Enquanto o secret não existe, este job apenas avisa e passa (não quebra o build).
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Portainer redeploy (webhook)
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::PORTAINER_WEBHOOK_URL não configurado — deploy automático pulado. Configure o secret pra ativar."
            exit 0
          fi
          echo "Disparando re-pull no Portainer…"
          code=$(curl -sS -o /tmp/resp -w "%{http_code}" -X POST "$WEBHOOK" || echo "000")
          echo "Portainer respondeu HTTP $code"
          # Webhook de serviço do Portainer retorna 204 (No Content) em sucesso; 200 em algumas versões.
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "::error::Webhook do Portainer falhou (HTTP $code)"; cat /tmp/resp || true; exit 1
          fi
          echo "✅ Re-pull disparado. O swarm vai puxar ghcr.io/${{ github.repository }}:latest e redeployar."
