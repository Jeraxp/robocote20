<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Bancada de Teste — Robocote</title>
<style>
  :root{
    --bg:#0f1620; --painel:#18222e; --linha:#28374a; --tinta:#e6edf4; --fraco:#93a4b6;
    --lead:#1d4ed8; --bot:#0f766e; --sis:#7c5e10; --erro:#b03b32;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tinta);font:15px/1.5 "Segoe UI",system-ui,sans-serif;
    display:flex;flex-direction:column;height:100vh}
  header{padding:12px 18px;background:var(--painel);border-bottom:1px solid var(--linha);
    display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.02em}
  .tag{font:600 11px/1 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;
    padding:4px 8px;border-radius:3px;background:#243447;color:var(--fraco)}
  header .cresce{flex:1}
  select,button,input{font:inherit;background:#1f2b39;color:var(--tinta);border:1px solid var(--linha);
    border-radius:6px;padding:8px 12px}
  button{cursor:pointer}
  button:hover{border-color:#3d5266}
  button.acao{background:var(--lead);border-color:var(--lead);font-weight:600}
  main{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:min(680px,88%);padding:10px 14px;border-radius:10px;white-space:pre-wrap;word-break:break-word}
  .lead{align-self:flex-end;background:var(--lead)}
  .bot{align-self:flex-start;background:var(--bot)}
  .sis{align-self:center;background:transparent;border:1px dashed var(--linha);color:var(--fraco);
    font:12px/1.4 ui-monospace,monospace;max-width:100%}
  .erro{align-self:center;background:var(--erro)}
  .estado{align-self:center;font:11px/1 ui-monospace,monospace;color:var(--fraco);letter-spacing:.06em}
  .pensando{align-self:flex-start;color:var(--fraco);font-style:italic;font-size:14px;padding:6px 4px}
  .pensando::after{content:'';animation:pontos 1.2s steps(4,end) infinite}
  @keyframes pontos{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
  footer{padding:12px 18px;background:var(--painel);border-top:1px solid var(--linha);display:flex;gap:10px}
  footer input{flex:1}
  .aviso{font-size:12px;color:var(--fraco);padding:0 18px 10px}
</style>
</head>
<body>
<header>
  <h1>Bancada de Teste — Robocote</h1>
  <span class="tag" id="tagStep">—</span>
  <span class="cresce"></span>
  <select id="tenant" title="Corretora do link. Só quem tem configuração de cotação consegue calcular — as demais servem pra testar a separação entre casas.">
    <option value="robotestes">robotestes — cota ✅ (use esta)</option>
    <option value="rpi">rpi — cota ✅ (piloto real)</option>
    <option value="renova">renova — sem config, não cota</option>
    <option value="vida-e-saude">vida-e-saude — sem config, não cota</option>
  </select>
  <button id="novo">Nova conversa</button>
</header>

<main id="fluxo"></main>
<p class="aviso" id="conv">conversa: —</p>

<footer>
  <input id="texto" placeholder="Escreva como o lead escreveria… (Enter envia)" autocomplete="off">
  <button class="acao" id="enviar">Enviar</button>
</footer>

<script>
const fluxo = document.getElementById('fluxo');
const campo = document.getElementById('texto');
const tagStep = document.getElementById('tagStep');
const convEl = document.getElementById('conv');
const tenantEl = document.getElementById('tenant');

function bolha(classe, texto) {
  const el = document.createElement('div');
  el.className = 'msg ' + classe;
  el.textContent = texto;
  fluxo.appendChild(el);
  fluxo.scrollTop = fluxo.scrollHeight;
}
function estado(texto) {
  const el = document.createElement('div');
  el.className = 'estado';
  el.textContent = texto;
  fluxo.appendChild(el);
  fluxo.scrollTop = fluxo.scrollHeight;
}

async function retomar() {
  const r = await fetch('/api/chat/session?tenant=' + encodeURIComponent(tenantEl.value), { credentials: 'same-origin' });
  const j = await r.json();
  convEl.textContent = 'conversa: ' + (j.conversationId || '—');
  fluxo.innerHTML = '';
  if (!j.exists) {
    bolha('sis', 'Conversa nova. Diga qualquer coisa para começar (ex.: "oi").');
    tagStep.textContent = '—';
    return;
  }
  for (const h of j.history) bolha(h.direction === 'inbound' ? 'lead' : 'bot', h.text);
  estado('retomado do servidor · passo: ' + (j.stepId || '—'));
  tagStep.textContent = j.stepId || '—';
}

async function enviar() {
  const texto = campo.value.trim();
  if (!texto) return;
  campo.value = '';
  bolha('lead', texto);

  // Indicador de espera: sai assim que a primeira fala do bot chega.
  const pensando = document.createElement('div');
  pensando.className = 'pensando';
  pensando.textContent = 'escrevendo';
  fluxo.appendChild(pensando);
  fluxo.scrollTop = fluxo.scrollHeight;
  const tiraPensando = () => { if (pensando.parentNode) pensando.remove(); };

  const t0 = performance.now();
  try {
    const r = await fetch('/api/chat/turn/stream?tenant=' + encodeURIComponent(tenantEl.value), {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: texto }),
    });
    if (!r.body) { tiraPensando(); bolha('erro', 'sem stream'); return; }

    const leitor = r.body.getReader();
    const dec = new TextDecoder();
    let buffer = '';
    let primeira = true;

    // Cada evento SSE traz uma fala do bot; renderiza NA HORA que chega.
    for (;;) {
      const { value, done } = await leitor.read();
      if (done) break;
      buffer += dec.decode(value, { stream: true });
      const partes = buffer.split('

');
      buffer = partes.pop() ?? '';
      for (const bloco of partes) {
        const linha = bloco.split('
').find((l) => l.startsWith('data:'));
        if (!linha) continue;
        let ev;
        try { ev = JSON.parse(linha.slice(5).trim()); } catch { continue; }
        if (ev.tipo === 'msg') {
          if (primeira) { tiraPensando(); primeira = false; }
          bolha('bot', ev.texto);
          // Depois da 1a fala, volta o indicador: a cotacao ainda esta correndo.
          fluxo.appendChild(pensando);
          fluxo.scrollTop = fluxo.scrollHeight;
        } else if (ev.tipo === 'fim') {
          tiraPensando();
          const ms = Math.round(performance.now() - t0);
          tagStep.textContent = ev.stepId || '—';
          estado(`ação: ${ev.action} · passo: ${ev.stepId || '—'} · ${ms}ms${ev.quoteGuid ? ' · cotação: ' + ev.quoteGuid : ''}${ev.tenantUnresolved ? ' · ⚠ corretora não identificada' : ''}`);
        } else if (ev.tipo === 'erro') {
          tiraPensando();
          bolha('erro', ev.erro);
        }
      }
    }
    tiraPensando();
  } catch (e) {
    tiraPensando();
    bolha('erro', 'falha de rede: ' + e.message);
  }
}

document.getElementById('enviar').addEventListener('click', enviar);
campo.addEventListener('keydown', (e) => { if (e.key === 'Enter') enviar(); });
document.getElementById('novo').addEventListener('click', async () => {
  await fetch('/api/chat/reset', { method: 'POST', credentials: 'same-origin' });
  await retomar();
  campo.focus();
});
tenantEl.addEventListener('change', retomar);
retomar().then(() => campo.focus());
</script>
</body>
</html>
